<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-8df8084b-247a-4c13-b5b0-50b41d41eb2f/styles.css">
<script src="_ds/industry-8df8084b-247a-4c13-b5b0-50b41d41eb2f/_ds_bundle.js"></script>
<!-- site.css carries the warm retune of the Industry palette (amber on paper).
     Without it the cards render in Industry's stock steel-blue-on-grey, which
     is what shipped in og-card.png: a preview that shares no color at all with
     the site it links to. -->
<link rel="stylesheet" href="site.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<style>
/* ---- card tokens ----
   A card is static art, not a themed page: site.css hangs the dark ramp off
   html[data-theme="dark"], which cannot scope to one card when several sit on
   the same board. Re-declaring those same values on .card-dark lets a dark
   card use the identical var() names as a light one. Keep in step with the
   dark block in site.css. */
.card-dark{
  --color-bg:#16130e; --color-surface:#1f1b14; --color-text:#f0ebe1;
  --color-accent:#e08b23; --color-accent-700:#eeb367; --color-accent-900:#48290c;
}

/* ---- wordmark ----
   isentropic-wordmark.svg has a 481x180 viewBox but its ink spans only
   x 18..438 and y 60..150 — 87% of the width and 50% of the height. Sizing the
   <img> therefore sizes mostly padding: the card used to ask for 123x46 and got
   an 18px cap-height, which LinkedIn paints at ~8px. Nobody could see it, so
   the card read as unbranded text.

   .wm sizes the box so the INK lands at a 52px cap-height, then pulls the dead
   padding back out of the flow with negative margins so the letterforms sit
   flush against the headline and the frame.
     scale 134/180 = 0.744 -> ink starts 13.4 in from the left, 44.6 down from
     the top, and leaves 22.7 of slack under the descenders. */
.wm{width:358px;height:134px;display:block;position:relative;align-self:flex-start;
    margin:-44.6px 0 -22.7px -13.4px;}

/* ---- registration marks ----
   The engineering-drawing motif, at 2px so it survives the ~46% downscale a
   feed applies; the old 1px marks and the 14%-opacity frame vanished entirely. */
.cardframe{position:absolute;inset:36px;border:1px solid color-mix(in srgb,var(--color-text) 22%,transparent);}
.regmark{position:absolute;width:24px;height:24px;
  background:linear-gradient(var(--color-accent),var(--color-accent)) center/100% 2px no-repeat,
             linear-gradient(var(--color-accent),var(--color-accent)) center/2px 100% no-repeat;}
.rm-tl{left:24px;top:24px;} .rm-tr{right:24px;top:24px;}
.rm-bl{left:24px;bottom:24px;} .rm-br{right:24px;bottom:24px;}

.card{width:1200px;height:630px;flex:none;position:relative;overflow:hidden;box-sizing:border-box;
      background:var(--color-bg);color:var(--color-text);display:flex;flex-direction:column;}
/* Content layers sit above the absolutely-positioned frame. Named explicitly
   rather than as `.card > *`: that blanket rule ties with .cardframe/.regmark
   on specificity, wins by source order, and drops the frame parts back into
   the flex flow — which reads as a mangled border and a top-crammed card. */
.card > .lyr{position:relative;}
.card-eyebrow{font-family:var(--font-heading);font-size:23px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;}
</style>
</helmet>

<div style="display:flex;flex-direction:column;gap:32px;padding:32px;background:var(--color-neutral-300);">

  <!-- ============================================================
       og-card.png — the link preview for every page of the site.
       Sized for the worst case rather than the best: a feed paints
       1200x630 at ~552px, so nothing here may depend on detail that
       does not survive a 46% downscale.
       ============================================================ -->
  <div id="og-card" class="card">
    <!-- The frame stops 20px short of the band rather than running under it,
         so the band reads as the card's base and not as a crop. -->
    <div class="lyr" style="flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:76px 80px 56px;">
      <div class="cardframe" style="inset:36px 36px 20px;"></div>
      <div class="regmark rm-tl"></div><div class="regmark rm-tr"></div>

      <img class="lyr wm" src="out/isentropic-wordmark.svg" alt="Isentropic">

      <!-- Headline only. The strapline under it was the first thing to go
           illegible at feed scale, and cutting it lets the two lines that do
           carry the message run bigger. -->
      <h1 class="lyr" style="font-family:var(--font-heading);font-size:86px;line-height:1.02;letter-spacing:-0.01em;font-weight:600;margin:0;max-width:1000px;">FPGA design &amp; verification.<br>Licensable IP cores.</h1>
    </div>

    <!-- Solid amber base. This is the one element that still carries the brand
         at 320px, where the frame is a hairline and the eyebrow type is mush. -->
    <div class="card-eyebrow" style="flex:none;height:96px;background:var(--color-accent);display:flex;align-items:center;justify-content:space-between;padding:0 80px;font-size:26px;letter-spacing:0.14em;color:#1c1a16;">
      <span>isentropic.com.br</span>
      <span style="opacity:.7;">São Paulo, Brazil</span>
    </div>
  </div>

  <!-- ============================================================
       og-openjls.png — the link preview for the OpenJLS page.
       Same family as og-card: same ground, same registration marks,
       and the wordmark carries the brand instead of a line of type
       too small to read.
       ============================================================ -->
  <div id="og-openjls" class="card card-dark" style="justify-content:space-between;padding:64px 80px 68px;background:var(--color-accent-900);">
    <div class="cardframe" style="border-color:color-mix(in srgb,var(--color-text) 26%,transparent);"></div>
    <div class="regmark rm-tl"></div><div class="regmark rm-tr"></div>
    <div class="regmark rm-bl"></div><div class="regmark rm-br"></div>

    <div class="lyr" style="display:flex;align-items:center;justify-content:space-between;gap:40px;">
      <img class="wm" src="out/isentropic-wordmark-dark.svg" alt="Isentropic" style="width:250px;height:94px;margin:-31.2px 0 -15.9px -9.4px;">
      <span class="card-eyebrow" style="color:color-mix(in srgb,var(--color-text) 72%,transparent);">Open source · GPLv3</span>
    </div>

    <div class="lyr" style="display:flex;flex-direction:column;gap:24px;">
      <h1 style="font-family:var(--font-heading);font-size:112px;line-height:0.96;letter-spacing:-0.015em;font-weight:600;margin:0;">OpenJLS</h1>
      <!-- One line only. What followed the em dash (one pixel per clock,
           byte-exact conformance) is already the stats row below, so cutting
           it loses nothing and buys the line a bigger size. -->
      <p style="font-family:var(--font-body);font-size:36px;line-height:1.3;margin:0;color:color-mix(in srgb,var(--color-text) 84%,transparent);max-width:1000px;">Vendor-agnostic lossless JPEG-LS encoder for FPGAs.</p>
    </div>

    <div class="lyr" style="display:grid;grid-template-columns:repeat(3,max-content);gap:64px;border-top:1px solid color-mix(in srgb,var(--color-text) 26%,transparent);padding-top:28px;">
      <div style="display:flex;flex-direction:column;gap:8px;">
        <span style="font-family:var(--font-heading);font-size:52px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;color:var(--color-accent-700);">~240</span>
        <span class="card-eyebrow" style="font-size:21px;color:color-mix(in srgb,var(--color-text) 70%,transparent);">Mpixel/s</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <span style="font-family:var(--font-heading);font-size:52px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;color:var(--color-accent-700);">1 px</span>
        <span class="card-eyebrow" style="font-size:21px;color:color-mix(in srgb,var(--color-text) 70%,transparent);">per clock</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <span style="font-family:var(--font-heading);font-size:52px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;color:var(--color-accent-700);">ISO 14495-1</span>
        <span class="card-eyebrow" style="font-size:21px;color:color-mix(in srgb,var(--color-text) 70%,transparent);">conformant</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
